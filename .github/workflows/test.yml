name: Subtitle and core unit tests
on:
  push:
    branches:
      - feature/v0.4.2-video-subtitle-identification
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source
        run: python -m compileall -q main.py core.py metadata.py subtitle_match.py tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
